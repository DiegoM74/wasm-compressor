<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compresor JPEG WASM</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css?v=2.5" />
    <link rel="stylesheet" href="css/compare.css?v=2.5" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="icon" type="image/x-icon" href="img/favicon.ico" />
  </head>

  <body>
    <h1>Compresor JPEG WASM</h1>
    <p class="subtitle">Compresión de imágenes en el navegador (serverless)</p>

    <div class="lib-status-container">
      <div id="status-mozjpeg" class="lib-status-pill">
        <svg class="status-icon">
          <use href="img/main.svg#refreshIcon"></use>
        </svg>
        <span>MozJPEG</span>
      </div>

      <div id="status-jpegli" class="lib-status-pill">
        <svg class="status-icon">
          <use href="img/main.svg#refreshIcon"></use>
        </svg>
        <span>Jpegli</span>
      </div>
    </div>

    <div
      id="drop-zone"
      role="region"
      aria-label="Área para arrastrar y soltar imágenes JPEG"
      tabindex="0"
    >
      <div class="drop-text">Arrastra tus imágenes JPEG aquí</div>
      <div class="drop-hint">
        o haz clic para seleccionar (puedes elegir varias)
      </div>
      <input
        type="file"
        id="file-input"
        accept="image/jpeg"
        style="display: none"
        multiple
      />
    </div>

    <div
      class="controls-group"
      role="group"
      aria-label="Controles de compresión y descarga"
      aria-busy="false"
    >
      <div class="controls-main">
        <div class="controls">
          <button id="compress-btn" disabled>Comprimir</button>
          <button id="download-btn" disabled>Descargar</button>
        </div>
      </div>

      <div class="controls-libs">
        <div class="controls-lib">
          <span class="lib-label">MozJPEG</span>
          <button id="compress-mozjpeg-btn" disabled>Comprimir</button>
          <button id="download-mozjpeg-btn" disabled>Descargar</button>
          <div class="config-buttons-group">
            <button
              id="config-mozjpeg-btn"
              class="config-btn"
              title="Configurar MozJPEG"
              aria-label="Configurar MozJPEG"
            >
              <svg class="config-icon">
                <use href="img/main.svg#configIcon"></use>
              </svg>
            </button>
            <button
              id="guide-mozjpeg-btn"
              class="config-btn"
              title="Guía de opciones MozJPEG"
              aria-label="Guía de opciones MozJPEG"
            >
              <svg class="config-icon">
                <use href="img/main.svg#infoIcon"></use>
              </svg>
            </button>
          </div>
        </div>

        <div class="controls-lib">
          <span class="lib-label">Jpegli</span>
          <button id="compress-jpegli-btn" disabled>Comprimir</button>
          <button id="download-jpegli-btn" disabled>Descargar</button>
          <div class="config-buttons-group">
            <button
              id="config-jpegli-btn"
              class="config-btn"
              title="Configurar Jpegli"
              aria-label="Configurar Jpegli"
            >
              <svg class="config-icon">
                <use href="img/main.svg#configIcon"></use>
              </svg>
            </button>
            <button
              id="guide-jpegli-btn"
              class="config-btn"
              title="Guía de opciones Jpegli"
              aria-label="Guía de opciones Jpegli"
            >
              <svg class="config-icon">
                <use href="img/main.svg#infoIcon"></use>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="status" role="status" aria-live="polite" aria-atomic="true">
      Esperando imágenes...
    </div>

    <div id="stats"></div>

    <div id="list-actions" class="list-actions">
      <button id="clear-all-btn" class="delete-btn">
        Eliminar todas las imágenes
      </button>
    </div>

    <div id="image-list" role="list" aria-label="Lista de imágenes cargadas"></div>

    <script src="js/main.js?v=2.5"></script>
    <script src="js/modal.js?v=2.5"></script>
    <script src="js/guide.js?v=2.5"></script>
    <script src="js/compare.js?v=2.5"></script>
  </body>
</html>
